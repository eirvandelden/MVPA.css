---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "current" reads .ruby-version, so the pin is the single source of truth.
        ruby: ["3.2", "current"]
    steps:
      - uses: actions/checkout@v7.0.1
      # rv treats .ruby-version as the active Ruby, so the older job cannot
      # install its own until the pin is out of the way. Restored before the
      # tests run, because one of them checks the pin is there.
      - if: matrix.ruby != 'current'
        run: mv .ruby-version .ruby-version.pinned
      - uses: spinel-coop/setup-rv@main
        with:
          ruby-version: ${{ matrix.ruby }}
          install-gems: true
      - if: matrix.ruby != 'current'
        run: mv .ruby-version.pinned .ruby-version
      - run: bundle exec rake test

  stylesheets:
    name: Stylesheets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Check the browser targets resolve
        run: yarn lint:browsers
      - name: Lint every stylesheet, not just the changed ones
        run: yarn lint:css

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint:spelling

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pipx install yamllint
      - run: yamllint --strict .

  gem:
    name: Gem builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current
      - run: gem build mvpa-css.gemspec
