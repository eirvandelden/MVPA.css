---
extends: default

# lefthook.yml is a symlink to a config outside the repository; it dangles on CI.
ignore: |
  node_modules/
  lefthook.yml

rules:
  line-length:
    max: 120
    level: warning
  comments:
    min-spaces-from-content: 1
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
    check-keys: false
